openapi: 3.1.0
info:
  title: IITM Mentoring Platform
  description: IITM BS mentoring platform API. Protected endpoints require a bearer
    token. Request expiry is evaluated when request lists, decisions, or new requests
    are processed. Suspension blocks protected actions and pauses active relationships;
    reactivation resumes a relationship only when the other participant is not suspended.
  version: 0.2.0
